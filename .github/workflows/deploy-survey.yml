name: Deploy Survey App

on:
  push:
    branches:
      - main
    paths:
      - 'survery-app/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: survery-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: survery-app/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          SURVEY_APP_URL: ${{ secrets.SURVEY_APP_URL }}

      - name: Deploy to Surge
        run: npx surge ./dist ${{ secrets.SURVEY_APP_DOMAIN }} --token ${{ secrets.SURGE_TOKEN }}
